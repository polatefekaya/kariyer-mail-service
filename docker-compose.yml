version: '3.8'

services:
  # ==========================================
  # 1. MICROSOFT GARNET (HIGH-PERFORMANCE CACHE)
  # ==========================================
  garnet:
    image: ghcr.io/microsoft/garnet:latest
    container_name: kariyer-garnet
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # Bound to localhost to prevent external access
    volumes:
      - garnet_data:/data
    command: ["--aof"]

  # ==========================================
  # 2. .NET MAIL MICROSERVICE (Host Network)
  # ==========================================
  mail-api:
    build:
      context: .
      dockerfile: src/Kariyer.Mail.Api/Dockerfile
      args:
        GITHUB_USER: ${GITHUB_USER}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: kariyer-mail-api
    network_mode: host # App runs directly on host network to reach local Postgres/RabbitMQ
    restart: unless-stopped
    depends_on:
      - garnet
    env_file:
      - .env

  # ==========================================
  # 3. LOKI (LOG AGGREGATION)
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: kariyer-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100" # Localhost only. Serilog will push here.
    command: -config.file=/etc/loki/local-config.yaml

  # ==========================================
  # 4. TEMPO (DISTRIBUTED TRACING)
  # ==========================================
  tempo:
    image: grafana/tempo:latest
    container_name: kariyer-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC (OpenTelemetry from .NET pushes here)
      - "127.0.0.1:3200:3200" # Tempo HTTP (Grafana queries this)

  # ==========================================
  # 5. PROMETHEUS (METRICS SCRAPING)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kariyer-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows Prometheus to scrape the host-networked .NET API
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090" # Localhost only

  # ==========================================
  # 6. GRAFANA (THE DASHBOARD)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: kariyer-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false

volumes:
  garnet_data:
